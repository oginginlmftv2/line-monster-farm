'use strict';

var ASST = { cards:[], selectedId:'', detail:null, tab:'card', busy:false, ability:null, abilityVersion:0, ocrConfigured:false, imageUploadConfigured:false, pendingCardImage:null, ocrFiles:[], ocrCandidates:[], localCardsDoc:null, localEffectsDoc:null,
  audit:{active:false,externalSha:null,expectedAbilitiesVersion:null,response:null,error:null,loading:false,showProcessed:false,requestedPage:1,fetchedPages:0,query:'',viewPage:1,detailIndex:null,detailDraftIndex:null,detailDraft:null,finalPreview:null,lastOperation:null,foldOpen:false,tab:'card_match_candidate'} };
var ASST_RATING_FIELDS=[['ikusei','総合力育成'],['karyo','火力'],['battle','バトル性能'],['ta','他オーラモン類']];

var ASST_CARD_TYPES=['ガード','かしこさ','ジャッジ','アサルト','回避','師匠','ちから','テクニック','友人','丈夫さ','インパクト','フォース','命中','メンタル','フィジカル','クイック','サバイブ','ライバル','ルミナス','バイタル','フォーカス','タフネス','ライフ','アキュメン'];

var ASST_OCR_CONDITIONS=[['mainBloodlineMatch','主血統一致'],['subBloodlineMatch','副血統一致'],['auraMatch','オーラ一致'],['monTypeMatch','モン類一致'],['speciesMatch','種族一致']];
function asstNullableText(id){ var value=el(id).value.trim();return value===''?null:value; }
function asstNullableNumber(id,label){ var value=el(id).value.trim();if(value==='')return null;var number=Number(value);if(!isFinite(number))throw new Error(label+'は数値で入力してください。');return number; }
function asstCheckedValues(name){ return Array.from(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(input){return input.value;}); }
function asstBoot(){ call('api_asstBootstrap',[],function(data){

  ASST.ocrConfigured=Boolean(data.ocr&&data.ocr.configured);
  ASST.imageUploadConfigured=Boolean(data.imageUpload&&data.imageUpload.configured);
  asstPopulateCardFilters();el('asst_btnCreateCard').disabled=false;el('asst_createHint').textContent='新規行はdraft相当で保存され、公開されません';el('asst_btnExport').disabled=false; asstRenderList();
}); }
function asstBootLocalPreview(){
  Promise.all([fetch('/src/data/assist-cards.json').then(function(response){return response.json();}),fetch('/src/data/assist-effects.json').then(function(response){return response.json();})]).then(function(docs){
    ASST.localCardsDoc=docs[0];ASST.localEffectsDoc=docs[1];ASST.cards=docs[0].cards.map(function(card){var group=docs[1].cards[card.cardId];return{cardId:card.cardId,name:card.name,rarity:card.rarity,aura:card.aura,monType:card.monType||'',effects:group&&group.effects?group.effects.length:0,abilities:0};});
    el('app_who').textContent='ローカル・読み取り専用';asstPopulateCardFilters();el('asst_btnCreateCard').disabled=true;el('asst_createHint').textContent='ローカルプレビューでは新規カードを登録できません';el('asst_btnExport').disabled=true;el('asst_btnAbilitySearch').disabled=true;asstRenderList();
  }).catch(function(error){el('asst_cardList').innerHTML='<div class="empty">ローカルDBを読み込めません: '+esc(error.message)+'</div>';});
}
function asstFilteredCards(){
  var q=el('asst_query').value.trim().toLowerCase(),monType=el('asst_filterMonType').value,aura=el('asst_filterAura').value,rarity=el('asst_filterRarity').value;
  return ASST.cards.filter(function(card){ return (!q||(card.cardId+' '+card.name).toLowerCase().indexOf(q)>=0)&&(!monType||card.monType===monType)&&(!aura||card.aura===aura)&&(!rarity||card.rarity===rarity); });
}
function asstPopulateCardFilter(select,label,values){select.replaceChildren();select.add(new Option(label+'すべて',''));values.forEach(function(value){select.add(new Option(value,value));});}

}
function asstRenderList(){
  var cards=asstFilteredCards();
  el('asst_summary').textContent='カード '+ASST.cards.length+'件 / 表示 '+cards.length+'件';
  el('asst_cardList').innerHTML=cards.length?cards.map(function(card){
    return '<button class="card-row'+(card.cardId===ASST.selectedId?' active':'')+'" data-id="'+esc(card.cardId)+'">'+
      '<strong>'+esc(card.name)+'</strong><span>'+esc(card.rarity)+'</span><span class="counts">'+esc(card.cardId)+' ・ 効果'+card.effects+' ・ 能力'+card.abilities+'</span></button>';

}
var ASST_AUDIT_PAGE_SIZE=1000;
var ASST_AUDIT_VIEW_SIZE=20;
var ASST_AUDIT_CATEGORIES=[
  ['card_match_candidate','カード対応候補',true],['unlinked_candidate','未紐付け候補',true],
  ['ID_REUSE_SUSPECTED','ID再利用疑い',true],['existingContentDifferences','既存内容差分',true],
  ['representationOnly','表記違い',false],['duplicate_local_content_match','重複内容一致',false],
  ['missing_upstream_observation','外部欠落観測',false]
];
var ASST_AUDIT_TABS=[
  ['card_match_candidate',['card_match_candidate'],['cardMatchCandidates']],
  ['unlinked_candidate',['unlinked_candidate'],['unlinkedCandidates']],
  ['ID_REUSE_SUSPECTED',['ID_REUSE_SUSPECTED'],['idReuseSuspected']],
  ['existingContentDifferences',['existingContentDifferences'],['existingContentDifferences']],
  ['other',['representationOnly','duplicate_local_content_match','missing_upstream_observation'],['representationOnly','duplicateLocalContentMatches','missingUpstreamObservations']]
];
function asstOpenExternalAudit(){
  ASST.audit.active=true;document.body.classList.add('editing');asstRenderExternalAudit();
  if(APP_LOCAL_PREVIEW)return;
  if(!ASST.audit.response&&!ASST.audit.loading)asstLoadExternalAudit(false);
}
function asstReturnFromExternalAudit(){
  ASST.audit.active=false;
  if(ASST.detail){document.body.classList.add('editing');asstRenderEditor();return;}
  document.body.classList.remove('editing');
  el('asst_editor').innerHTML='<div class="empty">左の一覧からカードを選んでください。</div>';
}
function asstAuditResponseIssue(data){
  if(!data||typeof data!=='object'||Array.isArray(data))return '応答がオブジェクトではありません。';
  if(data.auditVersion!==3||data.provider!=='lmfdb')return 'auditVersionまたはproviderが不正です。';
  if(!/^[0-9a-f]{40}$/.test(String(data.externalSha||''))||!/^[0-9a-f]{64}$/.test(String(data.externalSha256||'')))return '外部SHAが不正です。';
  if(['PASS','FAIL'].indexOf(data.auditStatus)<0||['BLOCKED','REVIEW_REQUIRED','SAFE'].indexOf(data.safetyVerdict)<0)return '監査状態または安全性判定が不正です。';
  if(!Array.isArray(data.blockReasons)||!Array.isArray(data.reviewReasons)||!Array.isArray(data.validationErrors)||!Array.isArray(data.candidates))return '理由または候補一覧が配列ではありません。';
  if(!data.counts||typeof data.counts!=='object')return '分類件数がありません。';
  var countKeys=['external','local','newCandidates','cardMatchCandidates','unlinkedCandidates','idReuseSuspected','existingContentDifferences','representationOnly','duplicateLocalContentMatches','missingUpstreamObservations','processed'];
  if(countKeys.some(function(key){return !Number.isInteger(data.counts[key])||data.counts[key]<0;}))return '分類件数が不正です。';
  var pagination=data.pagination;
  if(!pagination||!Number.isInteger(pagination.page)||pagination.page<1||pagination.pageSize!==ASST_AUDIT_PAGE_SIZE||
      !Number.isInteger(pagination.totalItems)||pagination.totalItems<0||!Number.isInteger(pagination.totalPages)||pagination.totalPages<0)return 'paginationが不正です。';
  if((pagination.totalPages===0&&pagination.totalItems!==0)||(pagination.totalPages>0&&pagination.page>pagination.totalPages)||data.candidates.length>ASST_AUDIT_PAGE_SIZE)return 'paginationと候補件数が一致しません。';
  if(data.auditStatus==='PASS'&&!/^[0-9a-f]{64}$/.test(String(data.expectedAbilitiesVersion||'')))return 'expectedAbilitiesVersionが不正です。';
  if(data.auditStatus==='FAIL'&&data.candidates.length)return 'FAIL応答に候補が含まれています。';
  var allowed=ASST_AUDIT_CATEGORIES.map(function(category){return category[0];});
  for(var index=0;index<data.candidates.length;index++){
    var candidate=data.candidates[index];
    if(!candidate||typeof candidate!=='object'||allowed.indexOf(candidate.classification)<0)return '候補の分類が不正です。（'+index+'件目）';
    if(!Number.isInteger(candidate.externalNumericId)||candidate.externalNumericId<=0||typeof candidate.processed!=='boolean'||typeof candidate.registrationEligible!=='boolean')return '候補の必須項目が不正です。（'+index+'件目 / 外部数値ID '+String(candidate.externalNumericId)+'）';
    if(candidate.externalSnapshot!=null&&typeof candidate.externalSnapshot!=='object')return 'externalSnapshotが不正です。（'+index+'件目 / 外部数値ID '+String(candidate.externalNumericId)+' / '+String(candidate.classification)+'）';
  }
  return '';
}
function asstLoadExternalAudit(latest){
  if(ASST.audit.loading)return;
  if(APP_LOCAL_PREVIEW){ASST.audit.error={type:'local',message:'ローカルプレビューではGAS APIを呼べないため、監査を実行できません。'};asstRenderExternalAudit();return;}
  asstDiscardAuditDetail();
  if(latest){ASST.audit.externalSha=null;ASST.audit.expectedAbilitiesVersion=null;}
  ASST.audit.response=null;ASST.audit.loading=true;ASST.audit.error=null;ASST.audit.fetchedPages=0;
  setBusy(true,'外部能力DBを監査中…');asstRenderExternalAudit();asstFetchAuditPage(1,[]);
}
function asstFailAuditLoad(type,message){ASST.audit.loading=false;setBusy(false);ASST.audit.response=null;ASST.audit.error={type:type,message:message};asstRenderExternalAudit();}
function asstFetchAuditPage(page,collected){
  ASST.audit.requestedPage=page;
  var payload={page:page,pageSize:ASST_AUDIT_PAGE_SIZE};
  if(ASST.audit.externalSha)payload.externalSha=ASST.audit.externalSha;
  google.script.run.withSuccessHandler(function(data){
    var issue=asstAuditResponseIssue(asstNormalizeAuditResponse(data));
    if(issue){asstFailAuditLoad('structure',issue);return;}
    if(page===1){ASST.audit.externalSha=data.externalSha;ASST.audit.expectedAbilitiesVersion=data.expectedAbilitiesVersion;}
    else if(data.externalSha!==ASST.audit.externalSha||data.expectedAbilitiesVersion!==ASST.audit.expectedAbilitiesVersion){asstFailAuditLoad('structure','取り込み中に外部コミットSHAまたはローカル能力versionが変わりました。最初から取り込み直してください。');return;}
    var all=collected.concat(data.candidates);
    ASST.audit.fetchedPages=page;
    if(data.auditStatus==='PASS'&&data.candidates.length&&data.pagination.totalPages>page){
      setBusy(true,'外部能力DBを取り込み中… '+all.length+' / '+data.pagination.totalItems+'件');
      asstFetchAuditPage(page+1,all);return;
    }
    data.candidates=all;
    data.pagination={page:1,pageSize:all.length,totalItems:data.pagination.totalItems,totalPages:all.length?1:0};
    ASST.audit.loading=false;setBusy(false);
    ASST.audit.response=data;ASST.audit.error=null;asstRenderExternalAudit();
  }).withFailureHandler(function(error){
    asstFailAuditLoad('api',error&&error.message?error.message:String(error));
  }).api_asstAuditExternalAbilities(payload);
}
var ASST_AUDIT_NULLABLE_CANDIDATE_FIELDS=['candidateKey','externalFingerprint','comparisonFingerprint','externalSnapshot','sameIdComparison','cardIdCandidate','disposition','localObservation','changedFields','comparison'];
function asstNormalizeAuditCandidate(candidate){
  if(!candidate||typeof candidate!=='object')return candidate;
  ASST_AUDIT_NULLABLE_CANDIDATE_FIELDS.forEach(function(field){if(candidate[field]===undefined)candidate[field]=null;});
  ['exactMatchAbilityIds','nfkcMatchAbilityIds'].forEach(function(field){if(!Array.isArray(candidate[field]))candidate[field]=[];});
  ['auditOnly','requiresIdReuseConfirmation'].forEach(function(field){if(candidate[field]===undefined)candidate[field]=false;});
  return candidate;
}
function asstNormalizeAuditResponse(data){
  if(data&&typeof data==='object'&&Array.isArray(data.candidates))data.candidates.forEach(function(candidate){asstNormalizeAuditCandidate(candidate);});
  return data;
}
function asstAuditLongValue(label){return /SHA|candidateKey|Fingerprint|fingerprint|指紋/.test(label);}
function asstAuditSummaryField(label,value){return '<div class="asstField"><label>'+esc(label)+'</label><div class="readonly'+(asstAuditLongValue(label)?' asst-audit-long':'')+'">'+esc(value)+'</div></div>';}
function asstAuditReasonText(values){return values.length?values.join('、'):'なし';}
function asstAuditSafetyText(data){
  return cmsLabel(data.safetyVerdict);
}
// 監査サマリーは常に閉じた状態から描画する。FAIL・BLOCKEDの説明はdetailsの外へ出して隠さない。
function asstRenderAuditSummary(data){
  var counts=data.counts;
  var isOpen=ASST.audit.foldOpen;
  var html='<details id="asst_auditSummary" class="asst-audit-summary"'+(isOpen?' open':'')+'><summary>監査サマリー: '+esc(cmsLabel(data.auditStatus))+' / 安全性: '+esc(cmsLabel(data.safetyVerdict))+' / 総候補数 '+esc(data.pagination.totalItems)+'</summary><div class="grid">'+
    asstAuditSummaryField('外部コミットSHA',data.externalSha)+asstAuditSummaryField('外部JSON SHA-256',data.externalSha256)+
    asstAuditSummaryField('auditVersion',data.auditVersion)+asstAuditSummaryField('auditStatus',cmsLabel(data.auditStatus))+
    asstAuditSummaryField('safetyVerdict',asstAuditSafetyText(data))+asstAuditSummaryField('blockReasons',asstAuditReasonText(data.blockReasons.map(cmsLabel)))+
    asstAuditSummaryField('reviewReasons',asstAuditReasonText(data.reviewReasons.map(cmsLabel)))+asstAuditSummaryField('外部件数',counts.external)+
    asstAuditSummaryField('ローカル件数',counts.local)+asstAuditSummaryField('カード対応候補数',counts.cardMatchCandidates)+
    asstAuditSummaryField('未紐付け候補数',counts.unlinkedCandidates)+asstAuditSummaryField('ID再利用疑い数',counts.idReuseSuspected)+
    asstAuditSummaryField('既存内容差分数',counts.existingContentDifferences)+asstAuditSummaryField('表記違い数',counts.representationOnly)+
    asstAuditSummaryField('重複内容一致数',counts.duplicateLocalContentMatches)+asstAuditSummaryField('外部欠落観測数',counts.missingUpstreamObservations)+
    asstAuditSummaryField('処置済み件数',counts.processed)+'</div></details>';
  if(data.auditStatus==='PASS'&&data.safetyVerdict==='BLOCKED'&&data.blockReasons.indexOf('ID_REUSE_SUSPECTED')>=0){
    html+='<p><strong>ID_REUSE_SUSPECTED:</strong> 監査処理自体は成功しています。外部数値IDの再利用疑いがあるため、安全性判定がBLOCKEDです。</p>';
  }
  if(data.auditStatus==='FAIL')html+='<div class="message error"><strong>監査結果: '+esc(cmsLabel('FAIL'))+'</strong><br>'+esc(data.validationErrors.length?data.validationErrors.join(' / '):'監査処理が失敗しました。')+'<br>候補一覧は表示しません。</div>';
  return html;
}
function asstAuditCandidateHtml(candidate,index){
  var snapshot=candidate.externalSnapshot||{},local=candidate.localObservation||{};
  var sourceName=snapshot.card==null?local.sourceName:snapshot.card;
  var name=snapshot.name==null?local.name:snapshot.name;
  var disposition=candidate.disposition?'処置済み: '+cmsLabel(candidate.disposition):'未処置';
  var eligibility=candidate.registrationEligible?'登録可能候補':'監査情報・処置対象';
  return '<article class="ability-item" data-audit-category="'+esc(candidate.classification)+'"><div><strong>'+esc(name||'—')+'</strong><div class="muted">分類: '+esc(asstAuditCategoryLabel(candidate.classification))+' / 外部数値ID: '+esc(candidate.externalNumericId)+'</div>'+
    '<div>元のカード名（sourceName）: '+esc(sourceName||'—')+' / source: '+esc(snapshot.source||'—')+' / rarity: '+esc(snapshot.rarity||'—')+'</div>'+
    '<div>cardIdCandidate: '+esc(candidate.cardIdCandidate||'—')+' / 処置状態: '+esc(disposition)+'</div><div><strong>'+esc(eligibility)+'</strong></div>'+
    '</div><button type="button" data-audit-detail="'+esc(index)+'">詳細を確認</button></article>';
}
function asstAuditCategoryLabel(classification){return cmsLabelShort(classification);}
function asstDiscardAuditDetail(){ASST.audit.detailIndex=null;ASST.audit.detailDraftIndex=null;ASST.audit.detailDraft=null;ASST.audit.finalPreview=null;}
function asstAuditEditable(candidate){return Boolean(candidate&&candidate.registrationEligible&&!candidate.processed&&!candidate.auditOnly&&['card_match_candidate','unlinked_candidate','ID_REUSE_SUSPECTED'].indexOf(candidate.classification)>=0);}
function asstOpenAuditDetail(index){
  var candidate=ASST.audit.response&&ASST.audit.response.candidates[index];if(!candidate)return;
  ASST.audit.detailIndex=index;ASST.audit.finalPreview=null;
  if(asstAuditEditable(candidate)&&ASST.audit.detailDraftIndex!==index){var original=asstAuditOriginal(candidate);ASST.audit.detailDraftIndex=index;ASST.audit.detailDraft={sourceName:original.sourceName,name:original.name,description:original.description,source:original.source,rarity:original.rarity,tags:original.tags.slice(),linkStatus:'',confirmations:{originalCompared:false,normalizationReviewed:false,cardReviewed:false,idReuseReviewed:false,draftReviewed:false}};}
  else if(!asstAuditEditable(candidate)){ASST.audit.detailDraftIndex=null;ASST.audit.detailDraft=null;}
  asstRenderExternalAudit();
}
function asstReturnFromAuditDetail(){asstCaptureAuditDraft();ASST.audit.detailIndex=null;ASST.audit.finalPreview=null;asstRenderExternalAudit();}
function asstAuditOriginal(candidate){var value=candidate.externalSnapshot||{};return {sourceName:value.card==null?'':String(value.card),name:value.name==null?'':String(value.name),description:value.desc==null?'':String(value.desc),source:value.source==null?'':String(value.source),rarity:value.rarity==null?'':String(value.rarity),tags:Array.isArray(value.tags)?value.tags.slice():[]};}
function asstAuditNfkc(value){if(Array.isArray(value))return value.map(function(item){return String(item).normalize('NFKC');});return String(value==null?'':value).normalize('NFKC');}
function asstAuditDisplayValue(value){return Array.isArray(value)?(value.length?value.join(' / '):'（なし）'):(value===''?'（空欄）':value);}
function asstAuditReadOnly(label,value){return '<div class="asstField"><label>'+esc(label)+'</label><div class="readonly'+(asstAuditLongValue(label)?' asst-audit-long':'')+'">'+esc(asstAuditDisplayValue(value))+'</div></div>';}

function asstCollectCreateCard(){
  var rawName=el('asst_f_create_name').value,rarity=el('asst_f_create_rarity').value;
  if(/[\u0000-\u001f\u007f-\u009f]/.test(rawName))throw new Error('カード名に改行・タブ・制御文字は使えません。');
  var name=rawName.trim();
  if(!name)throw new Error('カード名は必須です。');
  if(ASST.cards.some(function(card){return card.name.trim()===name&&card.rarity===rarity;}))throw new Error('同じカード名とレアリティのカードが既にあります。');
  return {name:name,rarity:rarity,aura:el('asst_f_create_aura').value,cardType:el('asst_f_create_cardType').value,monType:el('asst_f_create_monType').value||null};
}
function asstCreateCard(){
  try{
    var card=asstCollectCreateCard();
    if(!confirm('新規カードを登録します。\n\ncardId: 登録時に自動採番（例 c0092-'+card.rarity+'）\nカード名: '+card.name+'\nレアリティ: '+card.rarity+'\n\n新規行として保存されますが、サイトにはまだ公開されません。\nよろしいですか？'))return;
    call('api_asstCreateCard',[card],function(result){
      ASST.cards=ASST.cards.filter(function(item){return item.cardId!==result.cardId;});ASST.cards.push(result.card);
      el('asst_summary').textContent='カード '+ASST.cards.length+'件';asstRenderList();
      asstOpenCard(result.cardId,'新規カードを登録しました（cardId: '+result.cardId+'）。画像は '+result.cardId+' のファイル名で追加し、必要項目を編集してください。サイトにはまだ公開されていません。');
    });
  }catch(error){show(error.message,true);}
}
function asstOpenCard(cardId,openedMessage){
  ASST.selectedId=cardId; ASST.tab='card'; ASST.pendingCardImage=null;ASST.ocrFiles=[];ASST.ocrCandidates=[];asstRenderList();
  if(APP_LOCAL_PREVIEW){var card=ASST.localCardsDoc.cards.find(function(item){return item.cardId===cardId;}),group=ASST.localEffectsDoc.cards[cardId];ASST.detail={card:card,version:1,effects:group.effects||[],abilities:[]};document.body.classList.add('editing');asstRenderEditor();return;}
  call('api_asstGetCard',[cardId],function(detail){ ASST.detail=detail; document.body.classList.add('editing'); asstRenderEditor();if(openedMessage)show(openedMessage,false); });
}

function asstSelectCardImage(){
  var file=this.files&&this.files[0];ASST.pendingCardImage=null;if(!file)return;
  if(['image/jpeg','image/png','image/webp'].indexOf(file.type)<0){show('JPEG / PNG / WebPだけを選択してください。',true);this.value='';return;}
  if(!file.size||file.size>2*1024*1024){show('画像は2MB以下にしてください。',true);this.value='';return;}
  var reader=new FileReader();reader.onerror=function(){show('画像を読み込めません。',true);};reader.onload=function(){var dataUrl=String(reader.result);ASST.pendingCardImage={name:file.name,mimeType:file.type,size:file.size,base64:dataUrl.split(',')[1]};el('asst_cardImagePreview').src=dataUrl;el('asst_cardImagePreview').hidden=false;show('画像を確認し、アップロードボタンを押してください。',false);};reader.readAsDataURL(file);
}
function asstUploadCardImage(){
  try{
    if(!ASST.pendingCardImage)throw new Error('アップロードする画像を選択してください。');
    if(!confirm('選択した画像を指定Driveへ保存します。\n同じcardIdの旧画像がDriveにある場合はゴミ箱へ移動します。\n既存91画像をDriveへ複製する処理ではありません。\n\nよろしいですか？'))return;
    var file=ASST.pendingCardImage;
    call('api_asstUploadCardImage',[{cardId:ASST.selectedId,version:ASST.detail.version,fileName:file.name,mimeType:file.mimeType,base64:file.base64}],function(result){
      ASST.pendingCardImage=null;ASST.detail.card.image=result.image;ASST.detail.version=result.version;
      el('asst_f_image').value=result.image;el('asst_f_imageFile').value='';el('asst_btnUploadCardImage').disabled=true;
      show('指定Driveへ保存しました: '+result.fileName+'（'+result.bytes+' bytes）。サイト表示はGitHub公開後です。',false);
    });

function asstBindFormationRemove(){ document.querySelectorAll('[data-remove-formation]').forEach(function(button){button.onclick=function(){button.closest('[data-formation-row]').remove();};}); }
function asstCollectRatings(){ if(!el('asst_f_ratingsEnabled').checked)return null;var result={};ASST_RATING_FIELDS.forEach(function(item){result[item[0]]=asstNullableNumber('asst_f_rating_'+item[0],item[1]);});return result; }
function asstCollectStats(){
  var result=[];
  for(var index=0;index<3;index++){
    var label=asstNullableText('asst_f_stat_label_'+index),value=asstNullableText('asst_f_stat_value_'+index);
    if((label===null)!==(value===null))throw new Error('ステータス '+(index+1)+' は項目名と数値を両方入力してください。');
    if(label!==null)result.push({label:label,value:value});
  }
  if(result.length!==0&&result.length!==3)throw new Error('ステータスは3項目すべて入力するか、すべて空欄にしてください。');
  return result;
}
function asstCollectFormations(){
  return Array.from(document.querySelectorAll('[data-formation-row]')).map(function(row,index){
    var title=row.querySelector('input').value.trim();if(!title)throw new Error('編成 '+(index+1)+'の編成名は必須です。');
    return {title:title,cards:Array.from(row.querySelectorAll('[data-formation-card]')).map(function(select){return select.value;}),rental:row.querySelector('[data-formation-rental]').value};
  });
}

      cardType:el('asst_f_cardType').value,monType:el('asst_f_monType').value||null,image:el('asst_f_image').value,
      event2:el('asst_f_event2').value||null,

      ratings:asstCollectRatings(),explanation:el('asst_f_explanation').value,formations:asstCollectFormations(),

function asstGasPromise(name,args){return new Promise(function(resolve,reject){var runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(error){reject(new Error(error&&error.message?error.message:String(error)));});runner[name].apply(runner,args||[]);});}

  el('asst_btnOcrDemo').onclick=function(){ASST.ocrCandidates=ASST.detail.effects.map(function(effect){var activation=asstOcrActivationConditions(effect.description,'conditional',effect.name);return{name:effect.name,description:effect.description,activationScope:activation?'conditional':'universal',activationConditions:activation,unlockRank:effect.unlockRank,sourceScreenshots:['画面デモ'],issues:activation?[]:['demo-background-not-available']};});asstRenderEditor();};
  document.querySelectorAll('[data-ocr-candidate]').forEach(function(row,index){

  });

// 削除・確認済み操作で再描画するため、検査せずに画面の編集内容を候補へ書き戻す。
function asstCaptureOcrCandidateEdits(){
  document.querySelectorAll('[data-ocr-candidate]').forEach(function(row,index){
    var candidate=ASST.ocrCandidates[index];if(!candidate)return;
    candidate.name=row.querySelector('[data-ocr-name]').value.trim();
    candidate.description=row.querySelector('[data-ocr-description]').value.trim();
    candidate.unlockRank=row.querySelector('[data-ocr-rank]').value;
    candidate.activationScope=row.querySelector('[data-ocr-scope]').value;
    if(candidate.activationScope!=='conditional'){candidate.activationConditions=null;return;}
    var types=Array.from(row.querySelectorAll('[data-ocr-condition]:checked')).map(function(input){return input.value;});
    if(!types.length){candidate.activationConditions=null;return;}
    var operands=types.map(function(type){return{type:type};});
    candidate.activationConditions={
      expression:operands.length===1?operands[0]:{operator:row.querySelector('[data-ocr-operator]').value,operands:operands},
      basis:row.querySelector('[data-ocr-basis]').dataset.ocrBasis||'manual'};
  });
}
function asstAddOcrCandidate(){
  asstCaptureOcrCandidateEdits();
  ASST.ocrCandidates.push({name:'',description:'',activationScope:'unknown',activationConditions:null,unlockRank:'無凸',
    sourceScreenshots:['手動追加'],issues:[],resolvedIssues:[]});
  asstRenderEditor();show('OCR候補を1件追加しました。効果名・説明・背景を入力してください。',false);
}
function asstRemoveOcrCandidate(index){
  if(!confirm('OCR候補 '+(index+1)+'を削除しますか？'))return;
  asstCaptureOcrCandidateEdits();ASST.ocrCandidates.splice(index,1);asstRenderEditor();
  show('OCR候補 '+(index+1)+'を削除しました。',false);
}
function asstResolveOcrCandidateIssues(index){
  var candidate=ASST.ocrCandidates[index];if(!candidate||!candidate.issues||!candidate.issues.length)return;
  if(!confirm('OCR候補 '+(index+1)+'の要確認「'+candidate.issues.join(', ')+'」を、原画像と照合済みとして解消しますか？'))return;
  asstCaptureOcrCandidateEdits();
  candidate.resolvedIssues=(candidate.resolvedIssues||[]).concat(candidate.issues).filter(function(value,position,array){return array.indexOf(value)===position;});
  candidate.issues=[];asstRenderEditor();show('OCR候補 '+(index+1)+'の要確認を確認済みにしました。',false);
}
function asstPopulateOcrConditionFields(row){
  var activation=asstOcrActivationConditions(row.querySelector('[data-ocr-description]').value.trim(),'conditional',row.querySelector('[data-ocr-name]').value.trim());if(!activation)return;
  var expression=activation.expression,types=(expression.operands||[expression]).map(function(item){return item.type;});
  row.querySelectorAll('[data-ocr-condition]').forEach(function(input){input.checked=types.indexOf(input.value)>=0;});
  if(expression.operator)row.querySelector('[data-ocr-operator]').value=expression.operator;var basis=row.querySelector('[data-ocr-basis]');if(basis){basis.dataset.ocrBasis=activation.basis||'manual';basis.textContent=activation.basis==='breeder-dependency'?'ブリーダー効果への依存から判定':'説明文から直接判定';}
}
function asstRunEffectOcr(){
  if(!ASST.ocrFiles.length)return;setBusy(true,'OCRを開始しています…');var groups=[];var failures=[];var chain=Promise.resolve();ASST.ocrFiles.forEach(function(file,index){chain=chain.then(function(){setBusy(true,'OCR処理中 '+(index+1)+' / '+ASST.ocrFiles.length+'：'+file.name);return asstGasPromise('api_asstOcrEffectImage',[{cardId:ASST.selectedId,fileName:file.name,mimeType:file.mimeType,base64:file.base64}]);}).then(function(result){groups.push(asstOcrParseCandidates(result.vision,file));}).catch(function(error){failures.push({fileName:file.name,reason:error&&error.message?error.message:String(error)});});});
  chain.then(function(){if(groups.length){ASST.ocrCandidates=asstOcrMergeCandidates(groups);asstRenderEditor();}setBusy(false);var summary='OCR候補 '+(groups.length?ASST.ocrCandidates.length:0)+'件を作成しました（成功 '+groups.length+' / 失敗 '+failures.length+'）。';if(failures.length){var details=failures.map(function(failure){return failure.fileName+' — '+failure.reason;}).join('\n');show(summary+'\n失敗:\n'+details,true);}else{show(summary+' 原画像と照合してください。',false);}}).catch(function(error){setBusy(false);show(error&&error.message?error.message:String(error),true);});
}
function asstCollectOcrCandidates(){return Array.from(document.querySelectorAll('[data-ocr-candidate]')).map(function(row,index){
  var scope=row.querySelector('[data-ocr-scope]').value,name=row.querySelector('[data-ocr-name]').value.trim(),description=row.querySelector('[data-ocr-description]').value.trim(),rank=row.querySelector('[data-ocr-rank]').value;
  if(!name||!description)throw new Error('OCR候補 '+(index+1)+'の効果名・説明は必須です。');if(scope==='unknown')throw new Error('OCR候補 '+(index+1)+'の背景を確認してください。');
  var activation=null,issues=(ASST.ocrCandidates[index].issues||[]).slice();if(scope==='conditional'){var types=Array.from(row.querySelectorAll('[data-ocr-condition]:checked')).map(function(input){return input.value;});if(!types.length)throw new Error('OCR候補 '+(index+1)+'の条件付き効果は、発動条件を1件以上選択してください。');var operands=types.map(function(type){return{type:type};});var basis=row.querySelector('[data-ocr-basis]').dataset.ocrBasis||'manual';activation={expression:operands.length===1?operands[0]:{operator:row.querySelector('[data-ocr-operator]').value,operands:operands},basis:basis};}
  issues=issues.filter(function(issue){if(issue==='background-unknown')return false;if(issue==='activation-condition-needs-review'&&(scope!=='conditional'||activation))return false;return true;});
  return{name:name,description:description,activationScope:scope,activationConditions:activation,unlockRank:rank,sourceScreenshots:ASST.ocrCandidates[index].sourceScreenshots||[],issues:issues,resolvedIssues:ASST.ocrCandidates[index].resolvedIssues||[]};
});}
// OCRの発動条件を効果DBの{operator,types}へ変換する。条件原文はどこにも保存しない。
function asstOcrConditionsToEffect(activation){
  if(!activation)return null;var expression=activation.expression,types=(expression.operands||[expression]).map(function(item){return item.type;});
  return types.length?{operator:expression.operator||'and',types:types}:null;
}
function asstApplyOcrCandidates(){try{if(!el('asst_ocrSourceConfirmed').checked)throw new Error('原画像と全候補を照合し、確認チェックを入れてください。');var candidates=asstCollectOcrCandidates();if(candidates.some(function(candidate){return candidate.issues&&candidate.issues.length;}))throw new Error('要確認項目が残っています。背景・発動条件・OCR文字列を原画像と照合してください。');if(!confirm('照合済みOCR候補 '+candidates.length+'件を効果編集へ反映します。まだ保存はされません。'))return;var existing=ASST.detail.effects.slice(),used={};var effects=candidates.map(function(candidate,index){var match=existing.find(function(effect){return !used[effect.effectId]&&asstOcrComparisonKey(effect.name)===asstOcrComparisonKey(candidate.name);});var id;if(match){id=match.effectId;used[id]=true;}else{id=asstNextEffectId(existing.concat(Object.keys(used).map(function(key){return{effectId:key};})));used[id]=true;}return{effectId:id,name:candidate.name,description:candidate.description,unlockRank:candidate.unlockRank,sortOrder:index+1,conditional:candidate.activationScope==='conditional'?1:0,conditions:asstOcrConditionsToEffect(candidate.activationConditions)};});ASST.detail.effects=effects;ASST.ocrFiles=[];ASST.ocrCandidates=[];ASST.tab='effects';asstRenderEditor();show('照合済みOCR候補を効果編集へ反映しました。内容確認後に保存してください。',false);}catch(error){show(error.message,true);}}
