function asstNullableText(id){ var value=el(id).value.trim();return value===''?null:value; }
function asstNullableNumber(id,label){ var value=el(id).value.trim();if(value==='')return null;var number=Number(value);if(!isFinite(number))throw new Error(label+'は数値で入力してください。');return number; }

function asstBoot(){ call('api_asstBootstrap',[],function(data){
  ASST.cards=data.cards; el('app_who').textContent=data.user.nickname+' / '+data.user.role;
  ASST.ocrConfigured=Boolean(data.ocr&&data.ocr.configured);

function asstBootLocalPreview(){

    ASST.localCardsDoc=docs[0];ASST.localEffectsDoc=docs[1];ASST.cards=docs[0].cards.map(function(card){var group=docs[1].cards[card.cardId];return{cardId:card.cardId,name:card.name,rarity:card.rarity,aura:card.aura,effects:group&&group.effects?group.effects.length:0,abilities:0};});
    el('app_who').textContent='ローカル・読み取り専用';el('asst_summary').textContent='カード '+ASST.cards.length+'件';el('asst_btnExport').disabled=true;el('asst_btnAbilitySearch').disabled=true;asstRenderList();
  }).catch(function(error){el('asst_cardList').innerHTML='<div class="empty">ローカルDBを読み込めません: '+esc(error.message)+'</div>';});

function asstFilteredCards(){
  var q=el('asst_query').value.trim().toLowerCase();

}
function asstRenderList(){
  var cards=asstFilteredCards();

function asstOpenCard(cardId){

function asstTabButton(key,label,count){ return '<button class="tab'+(ASST.tab===key?' active':'')+'" data-tab="'+key+'">'+label+(count==null?'':' ('+count+')')+'</button>'; }

function asstField(id,label,type,value,readonly){ return '<div class="asstField"><label>'+label+'</label><input id="asst_f_'+id+'" type="'+type+'" value="'+esc(value)+'"'+(readonly?' readonly class="readonly"':'')+'></div>'; }

function asstRenderAccessoryField(value){

function asstRenderStatsFields(stats){

function asstCardOptions(selected,blank){

function asstFormationRow(formation,index){

function asstRenderFormationsField(formations){ return '<div class="asstField wide"><label>おすすめ編成</label><div id="asst_formationRows">'+formations.map(asstFormationRow).join('')+'</div><button type="button" id="asst_btnAddFormation">編成を追加</button></div>'; }
function asstBindCardForm(){
  el('asst_btnSaveCard').onclick=asstSaveCard;
  if(el('asst_f_imageFile'))el('asst_f_imageFile').onchange=asstSelectCardImage;
  if(el('asst_btnUploadCardImage'))el('asst_btnUploadCardImage').onclick=asstUploadCardImage;
  var enabled=el('asst_f_ratingsEnabled');function toggleRatings(){ASST_RATING_FIELDS.forEach(function(item){el('asst_f_rating_'+item[0]).disabled=!enabled.checked;});}enabled.onchange=toggleRatings;toggleRatings();
  el('asst_btnAddFormation').onclick=function(){var index=document.querySelectorAll('[data-formation-row]').length;el('asst_formationRows').insertAdjacentHTML('beforeend',asstFormationRow(null,index));asstBindFormationRemove();};
  asstBindFormationRemove();
}
function asstSelectCardImage(){
  var file=this.files&&this.files[0];ASST.pendingCardImage=null;if(!file)return;
  if(['image/jpeg','image/png','image/webp'].indexOf(file.type)<0){show('JPEG / PNG / WebPだけを選択してください。',true);this.value='';return;}
  if(!file.size||file.size>2*1024*1024){show('画像は2MB以下にしてください。',true);this.value='';return;}
  var reader=new FileReader();reader.onerror=function(){show('画像を読み込めません。',true);};reader.onload=function(){var dataUrl=String(reader.result);ASST.pendingCardImage={name:file.name,mimeType:file.type,size:file.size,base64:dataUrl.split(',')[1]};el('asst_cardImagePreview').src=dataUrl;show('画像を確認し、アップロードボタンを押してください。',false);};reader.readAsDataURL(file);
}
function asstUploadCardImage(){
  try{
    if(!ASST.pendingCardImage)throw new Error('アップロードする画像を選択してください。');
    if(!confirm('選択した画像を指定Driveへ保存します。\n同じcardIdの旧画像がDriveにある場合はゴミ箱へ移動します。\n既存91画像をDriveへ複製する処理ではありません。\n\nよろしいですか？'))return;
    var file=ASST.pendingCardImage;
    call('api_asstUploadCardImage',[{cardId:ASST.selectedId,version:ASST.detail.version,fileName:file.name,mimeType:file.mimeType,base64:file.base64}],function(result){
      ASST.pendingCardImage=null;ASST.detail.card.image=result.image;ASST.detail.version=result.version;
      el('asst_f_image').value=result.image;el('asst_f_imageFile').value='';el('asst_btnUploadCardImage').disabled=true;
      show('指定Driveへ保存しました: '+result.fileName+'（'+result.bytes+' bytes）。サイト表示はGitHub公開後です。',false);
    });
  }catch(error){show(error.message,true);}
}
function asstBindFormationRemove(){ document.querySelectorAll('[data-remove-formation]').forEach(function(button){button.onclick=function(){button.closest('[data-formation-row]').remove();};}); }
function asstCollectRatings(){ if(!el('asst_f_ratingsEnabled').checked)return null;var result={};ASST_RATING_FIELDS.forEach(function(item){result[item[0]]=asstNullableNumber('asst_f_rating_'+item[0],item[1]);});return result; }
function asstCollectStats(){
  var result=[];
  for(var index=0;index<3;index++){
    var label=asstNullableText('asst_f_stat_label_'+index),value=asstNullableText('asst_f_stat_value_'+index);
    if((label===null)!==(value===null))throw new Error('ステータス '+(index+1)+' は項目名と数値を両方入力してください。');
    if(label!==null)result.push({label:label,value:value});
  }
  if(result.length!==0&&result.length!==3)throw new Error('ステータスは3項目すべて入力するか、すべて空欄にしてください。');
  return result;
}
function asstCollectFormations(){
  return Array.from(document.querySelectorAll('[data-formation-row]')).map(function(row,index){
    var title=row.querySelector('input').value.trim();if(!title)throw new Error('編成 '+(index+1)+'の編成名は必須です。');
    return {title:title,cards:Array.from(row.querySelectorAll('[data-formation-card]')).map(function(select){return select.value;}),rental:row.querySelector('[data-formation-rental]').value};
  });

function asstSaveCard(){

    var c=ASST.detail.card;
    var card={cardId:c.cardId,name:el('asst_f_name').value,rarity:el('asst_f_rarity').value,aura:el('asst_f_aura').value,
      cardType:el('asst_f_cardType').value,monType:el('asst_f_monType').value||null,image:el('asst_f_image').value,
      event2:el('asst_f_event2').value||null,
      releasedAt:el('asst_f_releasedAt').value||null,stats:asstCollectStats(),limitBreak:c.limitBreak,
      accessoryStatus:el('asst_f_accessoryStatus').value,
      ratings:asstCollectRatings(),explanation:el('asst_f_explanation').value,formations:asstCollectFormations(),
      sapoRef:c.sapoRef};

      show('保存しました。version '+result.version,false); asstOpenCard(c.cardId);
    });
  }catch(error){show(error.message,true);}
}
function asstEffectRow(effect,index){

    asstField('effect_'+index+'_id','effectId','text',effect.effectId,true)+asstSelectField('effect_'+index+'_rank','解放ランク',['無凸','1凸','2凸','3凸','4凸'],effect.unlockRank)+
    asstField('effect_'+index+'_name','効果名','text',effect.name)+'<div class="asstField wide"><label>説明</label><textarea id="asst_f_effect_'+index+'_description">'+esc(effect.description)+'</textarea></div></div>'+
    '<button type="button" data-effect-up>↑ 上へ</button> <button type="button" data-effect-down>↓ 下へ</button> <button type="button" data-effect-remove>削除</button></fieldset>';

function asstRenderEffectsForm(d){ return '<p class="muted">effectIdは変更不可、sortOrderは表示順から自動設定します。</p><div id="asst_effectRows">'+d.effects.map(asstEffectRow).join('')+'</div><button type="button" id="asst_btnAddEffect">効果を追加</button>'+
  '<div class="actions"><button class="primary" id="asst_btnSaveEffects"'+(APP_LOCAL_PREVIEW?' disabled':'')+'>効果を保存</button><span class="muted">0件で保存するとdraftになります</span></div>'; }
function asstCollectEffects(validate){

    var effect={effectId:row.querySelector('input[readonly]').value,name:row.querySelector('input:not([readonly])').value.trim(),description:row.querySelector('textarea').value.trim(),unlockRank:row.querySelector('select').value,sortOrder:index+1};

  });

function asstNextEffectId(effects){ var max=effects.reduce(function(value,effect){var match=effect.effectId.match(/-e(\d+)$/);return Math.max(value,match?Number(match[1]):0);},0);return ASST.selectedId+'-e'+String(max+1).padStart(2,'0'); }

function asstBindEffectsForm(){

function asstSaveEffects(){ try{ var effects=asstCollectEffects(true);call('api_asstSaveEffects',[{cardId:ASST.selectedId,effects:effects}],function(){show('効果を保存しました。',false);asstOpenCard(ASST.selectedId);});}catch(error){show(error.message,true);} }
function asstOcrComparisonKey(value){return String(value||'').normalize('NFKC').toLowerCase().replace(/[\s「」『』【】\[\]()（）<>＜＞・、。:：!！?？/／]/g,'');}
function asstOcrTitleKey(value){return asstOcrComparisonKey(value).replace(/[|｜]/g,'ii').replace(/\+$/,'');}
function asstOcrEditDistance(left,right){var previous=Array.from({length:right.length+1},function(_,index){return index;});for(var i=1;i<=left.length;i++){var current=[i];for(var j=1;j<=right.length;j++)current[j]=Math.min(current[j-1]+1,previous[j]+1,previous[j-1]+(left.charAt(i-1)===right.charAt(j-1)?0:1));previous=current;}return previous[right.length];}
function asstOcrMatchesKnownTitle(value,known){var key=asstOcrTitleKey(value);return known.some(function(knownName){var knownKey=asstOcrTitleKey(knownName);return key===knownKey||(Math.min(key.length,knownKey.length)>=6&&asstOcrEditDistance(key,knownKey)<=2);});}
function asstOcrMedian(values){var sorted=values.slice().sort(function(a,b){return a-b;});return sorted.length?sorted[Math.floor(sorted.length/2)]:null;}
function asstOcrBounds(vertices){
  var xs=vertices.map(function(vertex){return Number(vertex.x||0);}),ys=vertices.map(function(vertex){return Number(vertex.y||0);});
  return {x:Math.min.apply(null,xs),y:Math.min.apply(null,ys),width:Math.max.apply(null,xs)-Math.min.apply(null,xs),height:Math.max.apply(null,ys)-Math.min.apply(null,ys)};
}
function asstOcrVisionLines(payload){
  var response=payload&&payload.responses&&payload.responses[0],page=response&&response.fullTextAnnotation&&response.fullTextAnnotation.pages&&response.fullTextAnnotation.pages[0];
  if(!page)throw new Error('OCR結果に座標付きテキストがありません。');
  var lines=[],text='',vertices=[];
  function flush(){var value=text.normalize('NFKC').replace(/\s+/g,' ').trim();if(value&&vertices.length)lines.push({text:value,bounds:asstOcrBounds(vertices)});text='';vertices=[];}
  (page.blocks||[]).forEach(function(block){(block.paragraphs||[]).forEach(function(paragraph){(paragraph.words||[]).forEach(function(word){(word.symbols||[]).forEach(function(symbol){

    asstAbilityCardField(a)+asstField('sourceName','元のカード名','text',a.sourceName)+
    asstField('abilityName','能力名','text',a.name)+asstSelectField('abilitySource','入手元',['イベント','閃き','EXトレ'],a.source)+
    asstSelectField('abilityRarity','レアリティ',['SSR','MR'],a.rarity,true)+asstField('sortOrder','sortOrder','number',a.sortOrder==null?'':a.sortOrder)+
    asstSelectField('linkStatus','linkStatus',['resolved','ambiguous','unlinked'],a.linkStatus)+asstSelectField('abilityStatus','状態',['draft','verified'],a.status)+
    asstRenderTagFields(a.tags)+asstSourceManagedField('内部flags',a.flags.length?'参照専用（'+a.flags.join('、')+'）':'なし')+
    '<div class="asstField wide"><label>説明</label><textarea id="asst_f_abilityDescription" rows="10">'+esc(a.description)+'</textarea></div></div>'+
    '<div class="actions"><button class="primary" id="asst_btnSaveAbility">能力を保存</button><span class="muted">version '+ASST.abilityVersion+'</span></div>';
  el('asst_btnBackAbility').onclick=function(){ if(ASST.detail)asstRenderEditor();else document.body.classList.remove('editing'); };
  el('asst_btnSaveAbility').onclick=asstSaveAbility;asstBindAbilityLinkStatus();
}
function asstSaveAbility(){
  try{
    var resolved=el('asst_f_linkStatus').value==='resolved';
    var a={abilityId:ASST.ability.abilityId,legacyId:ASST.ability.legacyId,cardId:resolved?(el('asst_f_abilityCardId').value||null):null,
      sourceName:el('asst_f_sourceName').value,name:el('asst_f_abilityName').value,description:el('asst_f_abilityDescription').value,
      source:el('asst_f_abilitySource').value,rarity:el('asst_f_abilityRarity').value||null,tags:asstCollectTags(),
      sortOrder:resolved?asstNullableNumber('asst_f_sortOrder','sortOrder'):null,linkStatus:el('asst_f_linkStatus').value,
      flags:ASST.ability.flags,status:el('asst_f_abilityStatus').value};
    call('api_asstSaveAbility',[{ability:a,version:ASST.abilityVersion}],function(result){ show('能力を保存しました。version '+result.version,false);asstOpenAbility(a.abilityId); });
  }catch(error){show(error.message,true);}
}
function asstSearchAbility(){ var id=prompt('abilityIdを入力してください'); if(!id)return; document.body.classList.add('editing'); asstOpenAbility(id.trim()); }
function asstExportAll(){
  if(!confirm('アシストシートを検証し、3つのJSONをブラウザへ保存します。公開サイトは変更しません。'))return;
  call('api_asstExport',[],function(result){
    result.files.forEach(function(file){var blob=new Blob([file.content],{type:'application/json;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);});
    alert('export成功\n'+result.files.map(function(file){return file.name+'\nSHA-256 '+file.sha256;}).join('\n\n'));
  });
}
el('asst_query').oninput=asstRenderList;el('asst_btnAbilitySearch').onclick=asstSearchAbility;el('asst_btnExport').onclick=asstExportAll;</script>
