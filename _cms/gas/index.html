<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ライ徹CMS</title><?!= include_('ui_common'); ?></head><body>
<div id="app_env" class="app-env" hidden></div><div id="app_toast" role="alert" aria-live="assertive" hidden></div><header><h1>ライ徹CMS</h1><span id="app_who"></span></header>
<nav id="app_tabs" class="app-tabs"></nav>
<main><div id="app_panel_monster"><?!= include_('ui_monster'); ?></div><div id="app_panel_assist"><?!= include_('ui_assist'); ?></div><div id="app_panel_gacha"><?!= include_('ui_gacha'); ?></div><div id="app_panel_publish"><?!= include_('ui_publish'); ?></div></main>
<div id="app_busyOverlay" class="app-busy-overlay" role="status" aria-live="polite"><div id="app_busyText" class="app-busy-dialog">処理中…</div></div>
<script>
var APP_PANEL_IDS = { monster: 'mon_root', assist: 'asst_root', gacha: 'gacha_root', publish: 'app_publish_root' };
function appOpenTab(name){var panelId=APP_PANEL_IDS[name];if(!panelId){console.error('タブに対応するパネルがありません: '+name);return;}APP.currentTab=name;document.querySelectorAll('.domain-panel').forEach(function(panel){panel.classList.toggle('active',panel.id===panelId);});document.querySelectorAll('[data-app-tab]').forEach(function(button){button.classList.toggle('active',button.dataset.appTab===name);});if(name==='monster'&&!MON.boot)monBoot();if(name==='assist'&&!ASST.cards.length)asstBoot();if(name==='gacha'&&!GACHA_UI.types.length)gachaBoot();}
function appBoot(){call('api_bootstrapShell',[],function(data){el('app_who').textContent=data.me.nickname+'（'+data.me.role+'）';if(data.environment==='rehearsal'){el('app_env').hidden=false;el('app_env').textContent='リハーサル環境 — 本番bookのコピーです。公開されません';}var labels={monster:'モンスター',assist:'アシスト',gacha:'ガチャ',publish:'公開'};el('app_tabs').innerHTML=data.tabs.map(function(tab){return '<button data-app-tab="'+tab+'">'+labels[tab]+'</button>';}).join('');document.querySelectorAll('[data-app-tab]').forEach(function(button){button.onclick=function(){appOpenTab(button.dataset.appTab);};});if(data.tabs.length)appOpenTab(data.tabs[0]);});}
window.addEventListener('load',appBoot);
</script></body></html>
