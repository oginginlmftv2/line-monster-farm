<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    :root { --ink:#302a22; --muted:#746b60; --line:#ddd2c1; --cream:#f8f2e7; --accent:#8b5e2f; --danger:#a12c2c; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#f4f0e9; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { border:1px solid #b8aa98; border-radius:7px; background:white; color:var(--ink); padding:8px 13px; cursor:pointer; }
    button.primary { color:white; border-color:var(--accent); background:var(--accent); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; min-height:58px; padding:10px 18px; background:#fff; border-bottom:1px solid var(--line); }
    header h1 { margin:0; font-size:19px; }
    .test { padding:3px 7px; border-radius:999px; background:#fff0c7; color:#7a4d00; font-size:12px; font-weight:700; }
    .spacer { flex:1; }
    .muted { color:var(--muted); font-size:13px; }
    main { display:grid; grid-template-columns:minmax(280px,360px) minmax(0,1fr); gap:16px; max-width:1440px; margin:auto; padding:16px; }
    .panel { background:white; border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 8px rgba(55,40,20,.05); }
    .sidebar { overflow:hidden; align-self:start; position:sticky; top:74px; max-height:calc(100vh - 90px); display:flex; flex-direction:column; }
    .filters { display:grid; grid-template-columns:1fr 110px; gap:8px; padding:12px; border-bottom:1px solid var(--line); }
    input,select,textarea { width:100%; border:1px solid #bfb3a3; border-radius:6px; background:#fff; color:var(--ink); padding:8px; }
    input[type="checkbox"] { width:auto; margin-right:4px; }
    textarea { min-height:90px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; line-height:1.5; }
    .card-list { overflow:auto; }
    .card-row { display:grid; grid-template-columns:1fr auto; gap:5px 10px; width:100%; padding:10px 12px; border:0; border-bottom:1px solid #eee6da; border-radius:0; text-align:left; }
    .card-row:hover,.card-row.active { background:var(--cream); }
    .card-row strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .counts { grid-column:1/-1; color:var(--muted); font-size:12px; }
    .editor { min-height:560px; padding:18px; }
    .empty { padding:60px 20px; color:var(--muted); text-align:center; }
    .tabs { display:flex; gap:5px; border-bottom:1px solid var(--line); margin:-4px 0 18px; overflow:auto; }
    .tab { border:0; border-bottom:3px solid transparent; border-radius:0; padding:10px 14px; white-space:nowrap; }
    .tab.active { border-bottom-color:var(--accent); color:var(--accent); font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
    .field label { display:block; margin:0 0 5px; font-size:13px; font-weight:700; }
    .field.wide { grid-column:1/-1; }
    .readonly { background:#eeeae4; }
    .actions { position:sticky; bottom:0; display:flex; align-items:center; gap:9px; margin:18px -18px -18px; padding:12px 18px; background:rgba(255,255,255,.96); border-top:1px solid var(--line); }
    .message { min-height:20px; margin:0 0 12px; padding:8px 10px; border-radius:6px; background:#edf6eb; color:#2e642d; display:none; white-space:pre-wrap; }
    .message.error { display:block; background:#fdecec; color:var(--danger); }
    .message.show { display:block; }
    .ability-list { display:grid; gap:8px; margin-top:12px; }
    .ability-item { display:flex; gap:8px; align-items:center; padding:9px; border:1px solid var(--line); border-radius:7px; }
    .ability-item button { margin-left:auto; }
    .export-box { padding:12px; margin-top:14px; border-radius:7px; background:var(--cream); }
    .mobile-back { display:none; margin-bottom:12px; }
    @media (max-width:760px) {
      header { padding:9px 12px; flex-wrap:wrap; }
      header h1 { font-size:16px; }
      main { display:block; padding:10px; }
      .sidebar { position:static; max-height:none; }
      .editor { display:none; margin-top:10px; padding:14px; }
      body.editing .sidebar { display:none; }
      body.editing .editor { display:block; }
      .mobile-back { display:inline-block; }
      .grid { grid-template-columns:1fr; }
      .field.wide { grid-column:auto; }
      .actions { margin:18px -14px -14px; padding:10px 14px; }
    }
  </style>
</head>
<body>
<header>
  <h1>ライ徹アシストCMS</h1><span class="test">TEST</span>
  <span id="summary" class="muted">読み込み中…</span><span class="spacer"></span>
  <button id="btnAbilitySearch">能力ID検索</button>
  <button id="btnExport" class="primary" disabled>3DBを検証・export</button>
  <span id="who" class="muted"></span>
</header>
<main>
  <aside class="panel sidebar">
    <div class="filters">
      <input id="query" type="search" placeholder="カード名・IDで検索">
    </div>
    <div id="cardList" class="card-list"><div class="empty">読み込み中…</div></div>
  </aside>
  <section id="editor" class="panel editor"><div class="empty">左の一覧からカードを選んでください。</div></section>
</main>
<script>
'use strict';
var state = { cards:[], selectedId:'', detail:null, tab:'card', busy:false, ability:null, abilityVersion:0 };
var RATING_FIELDS=[['ikusei','総合力育成'],['karyo','火力'],['battle','バトル性能'],['ta','他オーラモン類']];
var ABILITY_TAGS=['オーラ白','オーラ緑','オーラ赤','オーラ青','オーラ黄','オーラ黒','ガッツ回復','ガッツ変化系','クリティカル','シールド','デバフ','不利以外','中盤','前半','創造','命中','命中強化','回避','完全回避','幻霊','序盤','後半','必中','怪物','攻撃','攻撃強化','有利時','無効化','無機','獣族','終盤','被ダメ軽減','追撃','追撃連撃','連撃','魔族'];
function el(id){ return document.getElementById(id); }
function esc(value){ return String(value == null ? '' : value).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nullableText(id){ var value=el(id).value.trim();return value===''?null:value; }
function nullableNumber(id,label){ var value=el(id).value.trim();if(value==='')return null;var number=Number(value);if(!isFinite(number))throw new Error(label+'は数値で入力してください。');return number; }
function checkedValues(name){ return Array.from(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(input){return input.value;}); }
function setBusy(busy){ state.busy=busy; document.querySelectorAll('button').forEach(function(button){ button.disabled=busy; }); el('btnExport').disabled=busy||!state.cards.length; }
function call(name,args,onSuccess){
  setBusy(true);
  var runner=google.script.run.withSuccessHandler(function(result){ setBusy(false); onSuccess(result); })
    .withFailureHandler(function(error){ setBusy(false); show(error&&error.message?error.message:String(error),true); });
  runner[name].apply(runner,args||[]);
}
function show(message,isError){
  var box=el('message');
  if(!box){ alert(message); return; }
  box.textContent=message; box.className='message show'+(isError?' error':'');
}
function boot(){ call('api_bootstrap',[],function(data){
  state.cards=data.cards; el('who').textContent=data.user.nickname+' / '+data.user.role;
  el('summary').textContent='カード '+data.cards.length+'件'; el('btnExport').disabled=false; renderList();
}); }
function filteredCards(){
  var q=el('query').value.trim().toLowerCase();
  return state.cards.filter(function(card){ return !q||(card.cardId+' '+card.name).toLowerCase().indexOf(q)>=0; });
}
function renderList(){
  var cards=filteredCards();
  el('cardList').innerHTML=cards.length?cards.map(function(card){
    return '<button class="card-row'+(card.cardId===state.selectedId?' active':'')+'" data-id="'+esc(card.cardId)+'">'+
      '<strong>'+esc(card.name)+'</strong><span>'+esc(card.rarity)+'</span><span class="counts">'+esc(card.cardId)+' ・ 効果'+card.effects+' ・ 能力'+card.abilities+'</span></button>';
  }).join(''):'<div class="empty">該当カードなし</div>';
  el('cardList').querySelectorAll('[data-id]').forEach(function(button){ button.onclick=function(){ openCard(button.dataset.id); }; });
}
function openCard(cardId){
  state.selectedId=cardId; state.tab='card'; renderList();
  call('api_getCard',[cardId],function(detail){ state.detail=detail; document.body.classList.add('editing'); renderEditor(); });
}
function tabButton(key,label,count){ return '<button class="tab'+(state.tab===key?' active':'')+'" data-tab="'+key+'">'+label+(count==null?'':' ('+count+')')+'</button>'; }
function renderEditor(){
  var d=state.detail;
  if(!d)return;
  var html='<button class="mobile-back" id="btnBack">← カード一覧</button><div id="message" class="message"></div>'+
    '<div class="tabs">'+tabButton('card','カード')+tabButton('effects','効果',d.effects.length)+tabButton('abilities','能力',d.abilities.length)+'</div>';
  if(state.tab==='card')html+=renderCardForm(d);
  if(state.tab==='effects')html+=renderEffectsForm(d);
  if(state.tab==='abilities')html+=renderAbilities(d);
  el('editor').innerHTML=html;
  el('btnBack').onclick=function(){ document.body.classList.remove('editing'); };
  el('editor').querySelectorAll('[data-tab]').forEach(function(button){ button.onclick=function(){ state.tab=button.dataset.tab; renderEditor(); }; });
  if(el('btnSaveCard'))bindCardForm();
  if(el('btnSaveEffects'))bindEffectsForm();
  el('editor').querySelectorAll('[data-ability]').forEach(function(button){ button.onclick=function(){ openAbility(button.dataset.ability); }; });
}
function optionList(values,selected,blank){ return (blank?'<option value="">—</option>':'')+values.map(function(value){ return '<option'+(value===selected?' selected':'')+'>'+esc(value)+'</option>'; }).join(''); }
function renderCardForm(d){
  var c=d.card;
  return '<div class="grid">'+
    field('cardId','cardId','text',c.cardId,true)+field('name','カード名','text',c.name)+
    selectField('rarity','レアリティ',['MR','SSR'],c.rarity)+selectField('aura','オーラ',['赤','緑','黄','白','黒','青'],c.aura)+
    field('cardType','カードタイプ','text',c.cardType)+selectField('monType','モン類',['幻霊','無機','創造','獣族','魔族','怪物'],c.monType,true)+
    field('image','画像パス','text',c.image)+
    field('event2','イベント2','text',c.event2||'')+field('releasedAt','実装日','text',c.releasedAt||'')+
    renderAccessoryField(c.accessoryStatus)+renderRatingsFields(c.ratings)+renderStatsFields(c.stats)+
    sourceManagedField('凸データ','参照専用（元データをそのまま保持）')+
    renderFormationsField(c.formations)+sourceManagedField('SAPO参照',c.sapoRef?'参照専用（'+c.sapoRef.type+' / index '+c.sapoRef.sapoIndex+'）':'参照なし')+
    '<div class="field wide"><label>管理者解説</label><textarea id="f_explanation" rows="12">'+esc(c.explanation)+'</textarea></div>'+
    '</div><div class="actions"><button class="primary" id="btnSaveCard">カードをtest保存</button><span class="muted">version '+d.version+' / cardIdは変更不可</span></div>';
}
function field(id,label,type,value,readonly){ return '<div class="field"><label>'+label+'</label><input id="f_'+id+'" type="'+type+'" value="'+esc(value)+'"'+(readonly?' readonly class="readonly"':'')+'></div>'; }
function selectField(id,label,values,selected,blank){ return '<div class="field"><label>'+label+'</label><select id="f_'+id+'">'+optionList(values,selected,blank)+'</select></div>'; }
function sourceManagedField(label,message){ return '<div class="field"><label>'+label+'</label><input class="readonly" readonly value="'+esc(message)+'"></div>'; }
function renderAccessoryField(value){
  return '<div class="field"><label>アクセサリー</label><select id="f_accessoryStatus"><option value="unknown"'+(value==='unknown'?' selected':'')+'>未確認</option><option value="yes"'+(value==='yes'?' selected':'')+'>あり</option><option value="no"'+(value==='no'?' selected':'')+'>なし</option></select></div>';
}
function renderRatingsFields(ratings){
  var enabled=ratings!==null,values=ratings||{};
  return '<div class="field wide"><label><input id="f_ratingsEnabled" type="checkbox"'+(enabled?' checked':'')+'> 評価データあり</label><div class="grid">'+RATING_FIELDS.map(function(item){return field('rating_'+item[0],item[1],'number',values[item[0]]==null?'':values[item[0]]);}).join('')+'</div></div>';
}
function renderStatsFields(stats){
  var rows=(stats||[]).slice(0,3);while(rows.length<3)rows.push({label:'',value:''});
  return '<div class="field wide"><label>ステータス（3項目）</label><div class="grid">'+rows.map(function(row,index){return field('stat_label_'+index,'項目名 '+(index+1),'text',row.label||'')+field('stat_value_'+index,'値 '+(index+1)+'（+数値 / +数値%）','text',row.value||'');}).join('')+'</div></div>';
}
function cardOptions(selected,blank){
  return (blank?'<option value="">— 未設定 —</option>':'')+state.cards.map(function(card){return '<option value="'+esc(card.cardId)+'"'+(card.cardId===selected?' selected':'')+'>'+esc(card.name)+'（'+esc(card.cardId)+'）</option>';}).join('');
}
function formationRow(formation,index){
  formation=formation||{title:'',cards:['','','','',''],rental:''};var cards=(formation.cards||[]).slice(0,5);while(cards.length<5)cards.push('');
  return '<fieldset data-formation-row><legend>編成 '+(index+1)+'</legend>'+field('formation_'+index+'_title','編成名','text',formation.title||'')+
    '<div class="grid">'+cards.map(function(cardId,slot){return '<div class="field"><label>カード '+(slot+1)+'</label><select data-formation-card>'+cardOptions(cardId,true)+'</select></div>';}).join('')+
    '<div class="field"><label>レンタル</label><select data-formation-rental>'+cardOptions(formation.rental||'',true)+'</select></div></div><button type="button" data-remove-formation>この編成を削除</button></fieldset>';
}
function renderFormationsField(formations){ return '<div class="field wide"><label>おすすめ編成</label><div id="formationRows">'+formations.map(formationRow).join('')+'</div><button type="button" id="btnAddFormation">編成を追加</button></div>'; }
function bindCardForm(){
  el('btnSaveCard').onclick=saveCard;
  var enabled=el('f_ratingsEnabled');function toggleRatings(){RATING_FIELDS.forEach(function(item){el('f_rating_'+item[0]).disabled=!enabled.checked;});}enabled.onchange=toggleRatings;toggleRatings();
  el('btnAddFormation').onclick=function(){var index=document.querySelectorAll('[data-formation-row]').length;el('formationRows').insertAdjacentHTML('beforeend',formationRow(null,index));bindFormationRemove();};
  bindFormationRemove();
}
function bindFormationRemove(){ document.querySelectorAll('[data-remove-formation]').forEach(function(button){button.onclick=function(){button.closest('[data-formation-row]').remove();};}); }
function collectRatings(){ if(!el('f_ratingsEnabled').checked)return null;var result={};RATING_FIELDS.forEach(function(item){result[item[0]]=nullableNumber('f_rating_'+item[0],item[1]);});return result; }
function collectStats(){
  var result=[];
  for(var index=0;index<3;index++){
    var label=nullableText('f_stat_label_'+index),value=nullableText('f_stat_value_'+index);
    if((label===null)!==(value===null))throw new Error('ステータス '+(index+1)+' は項目名と数値を両方入力してください。');
    if(label!==null)result.push({label:label,value:value});
  }
  if(result.length!==0&&result.length!==3)throw new Error('ステータスは3項目すべて入力するか、すべて空欄にしてください。');
  return result;
}
function collectFormations(){
  return Array.from(document.querySelectorAll('[data-formation-row]')).map(function(row,index){
    var title=row.querySelector('input').value.trim();if(!title)throw new Error('編成 '+(index+1)+'の編成名は必須です。');
    return {title:title,cards:Array.from(row.querySelectorAll('[data-formation-card]')).map(function(select){return select.value;}),rental:row.querySelector('[data-formation-rental]').value};
  });
}
function saveCard(){
  try{
    var c=state.detail.card;
    var card={cardId:c.cardId,name:el('f_name').value,rarity:el('f_rarity').value,aura:el('f_aura').value,
      cardType:el('f_cardType').value,monType:el('f_monType').value||null,image:el('f_image').value,
      event2:el('f_event2').value||null,
      releasedAt:el('f_releasedAt').value||null,stats:collectStats(),limitBreak:c.limitBreak,
      accessoryStatus:el('f_accessoryStatus').value,
      ratings:collectRatings(),explanation:el('f_explanation').value,formations:collectFormations(),
      sapoRef:c.sapoRef};
    call('api_saveCard',[{cardId:c.cardId,version:state.detail.version,card:card}],function(result){
      show('保存しました。version '+result.version,false); openCard(c.cardId);
    });
  }catch(error){show(error.message,true);}
}
function effectRow(effect,index){
  return '<fieldset data-effect-row><legend>効果 '+(index+1)+'</legend><div class="grid">'+
    field('effect_'+index+'_id','effectId','text',effect.effectId,true)+selectField('effect_'+index+'_rank','解放ランク',['無凸','1凸','2凸','3凸','4凸'],effect.unlockRank)+
    field('effect_'+index+'_name','効果名','text',effect.name)+'<div class="field wide"><label>説明</label><textarea id="f_effect_'+index+'_description">'+esc(effect.description)+'</textarea></div></div>'+
    '<button type="button" data-effect-up>↑ 上へ</button> <button type="button" data-effect-down>↓ 下へ</button> <button type="button" data-effect-remove>削除</button></fieldset>';
}
function renderEffectsForm(d){ return '<p class="muted">effectIdは変更不可、sortOrderは表示順から自動設定します。</p><div id="effectRows">'+d.effects.map(effectRow).join('')+'</div><button type="button" id="btnAddEffect">効果を追加</button>'+
  '<div class="actions"><button class="primary" id="btnSaveEffects">効果をtest保存</button><span class="muted">0件で保存するとdraftになります</span></div>'; }
function collectEffects(validate){
  return Array.from(document.querySelectorAll('[data-effect-row]')).map(function(row,index){
    var effect={effectId:row.querySelector('input[readonly]').value,name:row.querySelector('input:not([readonly])').value.trim(),description:row.querySelector('textarea').value.trim(),unlockRank:row.querySelector('select').value,sortOrder:index+1};
    if(validate&&(!effect.effectId||!effect.name||!effect.description))throw new Error('効果 '+(index+1)+'のID・効果名・説明は必須です。');return effect;
  });
}
function nextEffectId(effects){ var max=effects.reduce(function(value,effect){var match=effect.effectId.match(/-e(\d+)$/);return Math.max(value,match?Number(match[1]):0);},0);return state.selectedId+'-e'+String(max+1).padStart(2,'0'); }
function rerenderEffects(effects){ state.detail.effects=effects;renderEditor(); }
function bindEffectsForm(){
  el('btnSaveEffects').onclick=saveEffects;
  el('btnAddEffect').onclick=function(){var effects=collectEffects(false);effects.push({effectId:nextEffectId(effects),name:'',description:'',unlockRank:'無凸',sortOrder:effects.length+1});rerenderEffects(effects);};
  document.querySelectorAll('[data-effect-row]').forEach(function(row,index){
    row.querySelector('[data-effect-up]').onclick=function(){var effects=collectEffects(false);if(index>0){var item=effects.splice(index,1)[0];effects.splice(index-1,0,item);rerenderEffects(effects);}};
    row.querySelector('[data-effect-down]').onclick=function(){var effects=collectEffects(false);if(index<effects.length-1){var item=effects.splice(index,1)[0];effects.splice(index+1,0,item);rerenderEffects(effects);}};
    row.querySelector('[data-effect-remove]').onclick=function(){var effects=collectEffects(false);effects.splice(index,1);rerenderEffects(effects);};
  });
}
function saveEffects(){ try{ var effects=collectEffects(true);call('api_saveEffects',[{cardId:state.selectedId,effects:effects}],function(){show('効果を保存しました。',false);openCard(state.selectedId);});}catch(error){show(error.message,true);} }
function renderAbilities(d){
  return '<p class="muted">resolved能力のみカードに紐づきます。ambiguous / unlinkedは能力ID検索から開けます。</p><div class="ability-list">'+
    (d.abilities.length?d.abilities.map(function(a){return '<div class="ability-item"><div><strong>'+esc(a.name)+'</strong><div class="muted">'+esc(a.abilityId)+' / '+esc(a.source)+'</div></div><button data-ability="'+esc(a.abilityId)+'">編集</button></div>';}).join(''):'<div class="empty">紐づく能力なし</div>')+'</div>';
}
function openAbility(id){ call('api_getAbility',[id],function(result){ state.ability=result.ability;state.abilityVersion=result.version;renderAbilityForm(); }); }
function renderTagFields(tags){
  var custom=tags.filter(function(tag){return ABILITY_TAGS.indexOf(tag)<0;});
  return '<div class="field wide"><label>タグ</label><div class="grid">'+ABILITY_TAGS.map(function(tag){return '<label><input type="checkbox" name="abilityTag" value="'+esc(tag)+'"'+(tags.indexOf(tag)>=0?' checked':'')+'> '+esc(tag)+'</label>';}).join('')+'</div>'+
    '<label>追加タグ（カンマまたは改行区切り）</label><textarea id="f_customTags" rows="3">'+esc(custom.join('\n'))+'</textarea></div>';
}
function collectTags(){
  var values=checkedValues('abilityTag');var custom=el('f_customTags').value.split(/[、,\n]/).map(function(value){return value.trim();}).filter(Boolean);
  var chosen=values.concat(custom).filter(function(value,index,array){return array.indexOf(value)===index;});
  var original=state.ability.tags||[];
  return original.filter(function(value){return chosen.indexOf(value)>=0;}).concat(chosen.filter(function(value){return original.indexOf(value)<0;}));
}
function abilityCardField(ability){ return '<div class="field"><label>cardId（resolvedのみ）</label><select id="f_abilityCardId">'+cardOptions(ability.cardId||'',true)+'</select></div>'; }
function bindAbilityLinkStatus(){
  function update(){var resolved=el('f_linkStatus').value==='resolved';el('f_abilityCardId').disabled=!resolved;el('f_sortOrder').disabled=!resolved;}
  el('f_linkStatus').onchange=update;update();
}
function renderAbilityForm(){
  var a=state.ability;
  el('editor').innerHTML='<button class="mobile-back" id="btnBack">← 戻る</button><div id="message" class="message"></div><h2>能力編集</h2><div class="grid">'+
    field('abilityId','abilityId','text',a.abilityId,true)+field('legacyId','legacyId','number',a.legacyId,true)+
    abilityCardField(a)+field('sourceName','元のカード名','text',a.sourceName)+
    field('abilityName','能力名','text',a.name)+selectField('abilitySource','入手元',['イベント','閃き','EXトレ'],a.source)+
    selectField('abilityRarity','レアリティ',['SSR','MR'],a.rarity,true)+field('sortOrder','sortOrder','number',a.sortOrder==null?'':a.sortOrder)+
    selectField('linkStatus','linkStatus',['resolved','ambiguous','unlinked'],a.linkStatus)+selectField('abilityStatus','状態',['draft','verified'],a.status)+
    renderTagFields(a.tags)+sourceManagedField('内部flags',a.flags.length?'参照専用（'+a.flags.join('、')+'）':'なし')+
    '<div class="field wide"><label>説明</label><textarea id="f_abilityDescription" rows="10">'+esc(a.description)+'</textarea></div></div>'+
    '<div class="actions"><button class="primary" id="btnSaveAbility">能力をtest保存</button><span class="muted">version '+state.abilityVersion+'</span></div>';
  el('btnBack').onclick=function(){ if(state.detail)renderEditor();else document.body.classList.remove('editing'); };
  el('btnSaveAbility').onclick=saveAbility;bindAbilityLinkStatus();
}
function saveAbility(){
  try{
    var resolved=el('f_linkStatus').value==='resolved';
    var a={abilityId:state.ability.abilityId,legacyId:state.ability.legacyId,cardId:resolved?(el('f_abilityCardId').value||null):null,
      sourceName:el('f_sourceName').value,name:el('f_abilityName').value,description:el('f_abilityDescription').value,
      source:el('f_abilitySource').value,rarity:el('f_abilityRarity').value||null,tags:collectTags(),
      sortOrder:resolved?nullableNumber('f_sortOrder','sortOrder'):null,linkStatus:el('f_linkStatus').value,
      flags:state.ability.flags,status:el('f_abilityStatus').value};
    call('api_saveAbility',[{ability:a,version:state.abilityVersion}],function(result){ show('能力を保存しました。version '+result.version,false);openAbility(a.abilityId); });
  }catch(error){show(error.message,true);}
}
function searchAbility(){ var id=prompt('abilityIdを入力してください'); if(!id)return; document.body.classList.add('editing'); openAbility(id.trim()); }
function exportAll(){
  if(!confirm('testシートを検証し、3つのJSONをブラウザへ保存します。公開サイトは変更しません。'))return;
  call('api_export',[],function(result){
    result.files.forEach(function(file){var blob=new Blob([file.content],{type:'application/json;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);});
    alert('export成功\n'+result.files.map(function(file){return file.name+'\nSHA-256 '+file.sha256;}).join('\n\n'));
  });
}
el('query').oninput=renderList;el('btnAbilitySearch').onclick=searchAbility;el('btnExport').onclick=exportAll;boot();
</script>
</body>
</html>
