name: CMS assist publish

on:
  push:
    branches:
      - cms/assist-publish

concurrency:
  group: cms-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-verify-publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check publish app secrets
        env:
          CMS_APP_ID: ${{ secrets.CMS_APP_ID }}
          CMS_APP_PRIVATE_KEY: ${{ secrets.CMS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CMS_APP_ID" ] || [ -z "$CMS_APP_PRIVATE_KEY" ]; then
            echo "Repository secrets CMS_APP_ID and CMS_APP_PRIVATE_KEY must both be configured."
            exit 1
          fi

      - name: Create publish token from GitHub App
        id: publish-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CMS_APP_ID }}
          private-key: ${{ secrets.CMS_APP_PRIVATE_KEY }}

      - name: Check out cms/assist-publish
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.publish-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify CMS assist source commit
        run: |
          git fetch origin main --no-tags
          git show origin/main:scripts/verify-assist-source.js > "$RUNNER_TEMP/verify-assist-source.js"
          node "$RUNNER_TEMP/verify-assist-source.js" source "$GITHUB_SHA" origin/main

      - name: Generate monster IDs
        run: node generate-ids.js

      - name: Verify CMS predicted IDs
        run: node scripts/verify-cms-ids.js

      - name: Build public files
        run: node build.js

      - name: Verify repository rules
        run: node scripts/verify.js

      - name: Confirm generated-file scope
        run: node "$RUNNER_TEMP/verify-assist-source.js" generated

      - name: Commit generated files and publish main
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build CMS assist publish ${source_sha:0:7}"
          fi
          published_sha="$(git rev-parse HEAD)"
          git push origin HEAD:main
          {
            echo "## CMS assist publish completed"
            echo
            echo "- Source: \`${source_sha}\`"
            echo "- Main: \`${published_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 能力が増えたら、未点検の能力（点・順位・Tier・載る体・読み方点検の引っかかり）を結果画面に出す。
      # 公開は止めない。検証は管理者の依頼で Claude のセッションが行う（docs/ability-scoring-design.md 5-1・5-4）
      - name: Summarize unreviewed abilities
        if: success()
        continue-on-error: true
        run: node scripts/audit-ability-reading.js --new --summary >> "$GITHUB_STEP_SUMMARY"
