name: verify

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify.js
      - run: node scripts/test-verify-cms-source.js
      - run: node scripts/test-verify-assist-cms.js
